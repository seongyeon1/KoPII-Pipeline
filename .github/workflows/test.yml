name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -e ".[dev]"
      - name: 린트
        run: |
          ruff check kopii tests scripts
          ruff format --check kopii tests scripts
      - name: 테스트
        run: pytest tests -v
