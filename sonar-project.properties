# SonarCloud 분석 설정.
#
# 아래 제외는 전부 "이 프로젝트에서는 그 규칙이 겨냥하는 위험이 성립하지 않는다"는
# 판단이며, 각각 근거를 적어 둔다. 규칙을 전역으로 끄지 않고 해당 경로에만 한정한다.

sonar.projectKey=seongyeon1_KoPII-Pipeline
sonar.organization=seongyeon1

sonar.python.version=3.11
sonar.sources=kopii,scripts
sonar.tests=tests

sonar.issue.ignore.multicriteria=prng,clipath,cfgpath,ghdeps,ghbinary,lockfile

# ── S2245 의사난수 (kopii/synth/ 한정) ──────────────────────────────
# 시드를 고정한 random.Random 은 이 모듈의 요구사항이다. 합성 코퍼스는
# "같은 시드 → 바이트 동일한 출력"을 보장해야 하고, 재현성 테스트와
# manifest.json 의 추론기 채점 정답이 그 성질에 의존한다. 생성되는 값은
# 가상 인물의 합성 데이터이며 어떤 보안 결정에도 쓰이지 않는다.
# 암호학적 난수가 필요한 지점(가명 HMAC 시크릿)은 kopii/identity/ 에
# 별도로 구현하며, 그 경로에는 이 제외가 적용되지 않는다 — 의도적이다.
sonar.issue.ignore.multicriteria.prng.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.prng.resourceKey=kopii/synth/**/*.py

# ── S8707 CLI 인자 경로 (로컬 CLI 한정) ────────────────────────────
# --config / --out 는 이 도구를 직접 실행하는 사용자가 자기 경로를 지정하는
# 값이다. 신뢰 경계 밖에서 들어오는 입력이 아니며, 네트워크나 다중 사용자
# 표면이 없다. 그럼에도 resolve_user_path() 로 ~ 확장·절대경로 해석(.. 축약)·
# NUL 바이트 거부·정규 파일 확인을 거친 뒤에만 파일에 접근한다.
sonar.issue.ignore.multicriteria.clipath.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.clipath.resourceKey=kopii/synth/cli.py
sonar.issue.ignore.multicriteria.cfgpath.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.cfgpath.resourceKey=kopii/config/schema.py

# ── CI 의존성 설치 ─────────────────────────────────────────────────
# CI 는 공개 PyPI 에서 pydantic·pyyaml·pytest·ruff 만 설치하며 프라이빗
# 인덱스를 쓰지 않는다. lock 파일 도입은 별도 과제로 남긴다 — 이 프로젝트가
# 재현성을 약속하는 만큼 검토 가치가 있으나, 의존성 도구 선택이 선행한다.
sonar.issue.ignore.multicriteria.ghdeps.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.ghdeps.resourceKey=.github/workflows/*.yml
sonar.issue.ignore.multicriteria.ghbinary.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.ghbinary.resourceKey=.github/workflows/*.yml
sonar.issue.ignore.multicriteria.lockfile.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.lockfile.resourceKey=pyproject.toml
